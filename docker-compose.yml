version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: llm-chatbot-backend
    ports:
      - "8000:8000"
    environment:
      - LLM_API_KEYS=${LLM_API_KEYS:-key_1_demo,key_2_demo}
      - DATABASE_URL=sqlite:////data/app.db
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,*}
      - ENABLE_FAILURE_SIMULATION=${ENABLE_FAILURE_SIMULATION:-true}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-gemini/gemini-2.0-flash}
      - CACHE_TYPE=${CACHE_TYPE:-local}
    volumes:
      - app_sqlite_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_BACKEND_URL=${VITE_BACKEND_URL:-http://localhost:8000}
    container_name: llm-chatbot-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  app_sqlite_data:
    name: llm_chatbot_sqlite_data
